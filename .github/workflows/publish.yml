name: Publish package

# Push a tag such as v1.0.1 to publish GameVoice 1.0.1 to GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test GameVoice.slnx -c Release
      - name: Pack
        run: dotnet pack src/GameVoice -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
