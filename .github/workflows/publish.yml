name: Publish package

# Push a tag such as v1.0.1 to publish GameVoice 1.0.1 to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test GameVoice.slnx -c Release
      - name: Pack
        run: dotnet pack src/GameVoice -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived nuget.org API key.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: davidjonessportronics
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
